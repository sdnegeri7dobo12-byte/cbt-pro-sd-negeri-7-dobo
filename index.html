<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102a56">
  <meta name="description" content="CBT Pro - Aplikasi Ujian Berbasis Komputer untuk persiapan semester.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <title>CBT Pro — Persiapan Semester</title>
  <style>
    :root { color-scheme: light; --navy:#102a56; --blue:#174b8b; --gold:#f4c542; }
    * { box-sizing:border-box; }
    html, body { margin:0; height:100%; font-family:Arial,Helvetica,sans-serif; background:#f3f6fb; }
    .app { height:100%; display:flex; flex-direction:column; }
    header { min-height:68px; display:flex; align-items:center; gap:12px; padding:10px 16px; color:white; background:linear-gradient(110deg,var(--navy),var(--blue)); box-shadow:0 2px 10px #0002; z-index:2; }
    header img { width:46px; height:46px; border-radius:50%; object-fit:cover; background:white; border:2px solid #fff; }
    .brand { flex:1; min-width:0; }
    .brand strong { display:block; font-size:17px; letter-spacing:.2px; }
    .brand span { display:block; font-size:12px; opacity:.88; margin-top:3px; }
    .actions { display:flex; gap:8px; }
    button, .open-link { border:0; border-radius:9px; padding:10px 12px; font-weight:700; cursor:pointer; text-decoration:none; font-size:13px; }
    #installBtn { background:var(--gold); color:#17233b; display:none; }
    #openBtn { background:#fff; color:var(--navy); }
    main { flex:1; min-height:0; position:relative; }
    iframe { width:100%; height:100%; border:0; display:block; background:white; }
    .loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; color:#526078; pointer-events:none; }
    .loading div { background:#fff; padding:16px 20px; border-radius:12px; box-shadow:0 3px 18px #102a5618; max-width:340px; }
    footer { padding:7px 12px; text-align:center; color:#64748b; font-size:11px; background:#fff; border-top:1px solid #e5eaf2; }
    @media(max-width:520px) {
      header { min-height:60px; padding:8px 10px; gap:9px; }
      header img { width:40px; height:40px; }
      .brand strong { font-size:15px; }
      .brand span { font-size:10px; }
      button, .open-link { padding:9px 10px; font-size:12px; }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <img src="./icons/icon-192.png" alt="Logo sekolah">
    <div class="brand">
      <strong>CBT Pro</strong>
      <span>Aplikasi Ujian • Persiapan Semester</span>
    </div>
    <div class="actions">
      <button id="installBtn" type="button">Instal Aplikasi</button>
      <a id="openBtn" class="open-link" href="https://script.google.com/macros/s/AKfycbxymDxNRrWlIInl64NYkOX2YXy5fhkWfk4-lUgD6w29S26F8B62N1i-owu4E1ihnwSiYA/exec" target="_blank" rel="noopener">Buka Penuh ↗</a>
    </div>
  </header>
  <main>
    <div class="loading" id="loading"><div>Memuat CBT Pro…<br><small>Pastikan perangkat terhubung ke internet.</small></div></div>
    <iframe id="appFrame" title="CBT Pro" src="https://script.google.com/macros/s/AKfycbxymDxNRrWlIInl64NYkOX2YXy5fhkWfk4-lUgD6w29S26F8B62N1i-owu4E1ihnwSiYA/exec" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
  </main>
  <footer>CBT Pro • SD Negeri 7 Dobo • Gunakan akun yang telah diberikan sekolah</footer>
</div>
<script>
  const frame = document.getElementById('appFrame');
  const loading = document.getElementById('loading');
  frame.addEventListener('load', () => { loading.style.display = 'none'; });
  let deferredPrompt;
  const installBtn = document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt', (event) => {
    event.preventDefault();
    deferredPrompt = event;
    installBtn.style.display = 'inline-block';
  });
  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.style.display = 'none';
  });
  window.addEventListener('appinstalled', () => { installBtn.style.display = 'none'; });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.error));
  }
</script>
</body>
</html>
